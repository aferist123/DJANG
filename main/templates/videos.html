{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Логістичні матеріали | NULPTRANS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        .exam-banner {
            background-color: #ffeb3b; color: #b71c1c; border: 3px solid #b71c1c;
            font-weight: 900; text-transform: uppercase; padding: 15px;
            text-align: center; margin-bottom: 30px; border-radius: 10px;
        }
        .video-card {
            cursor: pointer; transition: 0.3s; border: none; border-radius: 15px; overflow: hidden;
            background: #212529; color: white; height: 200px; display: flex; align-items: center; justify-content: center;
        }
        .video-card:hover { transform: scale(1.05); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .play-icon { font-size: 3rem; color: #ffeb3b; }
        .modal-content { border-radius: 20px; background: #000; border: none; }
        video { width: 100%; max-height: 80vh; border-radius: 10px; }
        .audio-player-container {
            background: white; padding: 20px; border-radius: 15px; border-left: 5px solid #0d6efd;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <a href="/" class="btn btn-outline-secondary mb-4">⬅ На головну</a>

    <div class="exam-banner shadow">
        ⚠️ Увага! Матеріали підготовлено спеціально для складання екзамену
    </div>

    <div class="audio-player-container shadow-sm mb-5">
        <h5 class="fw-bold text-primary mb-3">MP3</h5>
        <audio controls class="w-100">
            <source src="{% static 'audio.mp3' %}" type="audio/mpeg">
            Ваш браузер не підтримує аудіо.
        </audio>
    </div>

    <h2 class="fw-bold mb-4"> Відео (MP4)</h2>
    
    <div class="row">
        <div class="col-md-6 col-lg-3 mb-4">
            <div class="card video-card" data-bs-toggle="modal" data-bs-target="#vid1">
                <div class="text-center">
                    <div class="play-icon">▶</div>
                    <h6 class="mt-2">Відео 1</h6>
                </div>
            </div>
        </div>
        <div class="col-md-6 col-lg-3 mb-4">
            <div class="card video-card" data-bs-toggle="modal" data-bs-target="#vid2">
                <div class="text-center">
                    <div class="play-icon">▶</div>
                    <h6 class="mt-2">Відео 2</h6>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="vid1" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-body text-center">
                <video controls>
                    <source src="{% static 'video1.mp4' %}" type="video/mp4">
                </video>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="vid2" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-body text-center">
                <video controls>
                    <source src="{% static 'video2.mp4' %}" type="video/mp4">
                </video>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Зупинка відео при закритті вікна
    document.querySelectorAll('.modal').forEach(m => {
        m.addEventListener('hidden.bs.modal', () => {
            m.querySelector('video').pause();
        });
    });
</script>
</body>
</html>
